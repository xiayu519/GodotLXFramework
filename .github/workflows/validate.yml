name: LXFramework validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_soak:
        description: Run five isolated Godot smoke cycles
        required: false
        type: boolean
        default: false
      run_export:
        description: Install Mono export templates and build Windows release
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 18 * * 6'

concurrency:
  group: lx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.416
      - name: Install exact Godot 4.7.2 .NET editor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $godot = Get-ChildItem -LiteralPath $destination -Filter '*_console.exe' -Recurse | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot Mono console executable was not found.' }
          "LX_GODOT=$($godot.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate framework
        shell: pwsh
        run: .\lx.ps1 validate
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lx-validation-${{ github.run_id }}
          path: godot_project/.lx/**/*.json
          if-no-files-found: ignore

  soak:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_soak)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.416
      - name: Install exact Godot 4.7.2 .NET editor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $godot = Get-ChildItem -LiteralPath $destination -Filter '*_console.exe' -Recurse | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot Mono console executable was not found.' }
          "LX_GODOT=$($godot.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and soak
        shell: pwsh
        run: |
          .\lx.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\lx.ps1 soak 5
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lx-soak-${{ github.run_id }}
          path: godot_project/.lx/**/*.json
          if-no-files-found: ignore

  export-windows:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_export)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.416
      - name: Install Godot editor and Mono export templates
        shell: pwsh
        run: |
          $editorArchive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $editorDestination = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile $editorArchive
          Expand-Archive -LiteralPath $editorArchive -DestinationPath $editorDestination
          $godot = Get-ChildItem -LiteralPath $editorDestination -Filter '*_console.exe' -Recurse | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot Mono console executable was not found.' }
          "LX_GODOT=$($godot.FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

          $templatePackage = Join-Path $env:RUNNER_TEMP 'mono-templates.tpz'
          $templateArchive = Join-Path $env:RUNNER_TEMP 'mono-templates.zip'
          $templateExtract = Join-Path $env:RUNNER_TEMP 'mono-templates'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz' -OutFile $templatePackage
          Copy-Item -LiteralPath $templatePackage -Destination $templateArchive
          Expand-Archive -LiteralPath $templateArchive -DestinationPath $templateExtract
          $templateTarget = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable.mono'
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $templateExtract 'templates\*') -Destination $templateTarget -Recurse -Force
      - name: Validate and export Windows release
        shell: pwsh
        run: |
          .\lx.ps1 validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\lx.ps1 export windows
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: lx-windows-${{ github.run_id }}
          path: build/windows/**
